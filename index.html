<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escolher Assento - Cinema VIP</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: #111;
  color: white;
  padding: 20px;
}

.container {
  max-width: 600px;
  margin: 0 auto;
}

h1 {
  margin-bottom: 30px;
}

.tela {
  background: #ccc;
  color: black;
  padding: 20px;
  margin: 30px auto;
  width: 80%;
  max-width: 300px;
  border-radius: 10px;
  font-weight: bold;
  font-size: 24px;
}

.cinema-layout {
  margin: 40px auto;
  padding: 20px;
  background: #222;
  border-radius: 10px;
}

.area {
  margin: 30px;
}

.area h3 {
  margin-bottom: 15px;
  color: #fff;
}

.assentos-grupo {
  display: flex;
  justify-content: center;
  gap: 10px;
}

.assento {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 60px;
  height: 60px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
  transition: all 0.3s ease;
  border: 2px solid transparent;
}

.livre { 
  background: gray; 
}

.livre:hover { 
  background: #999; 
  transform: scale(1.05);
}

.selecionado { 
  background: green;
  border: 2px solid #fff;
  box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
}

.ocupado { 
  background: red; 
  cursor: not-allowed; 
}

.legenda {
  display: flex;
  justify-content: center;
  gap: 30px;
  margin: 30px 0;
  font-size: 14px;
  flex-wrap: wrap;
}

.legenda-item {
  display: flex;
  align-items: center;
  gap: 8px;
}

.legenda-box {
  width: 30px;
  height: 30px;
  border-radius: 5px;
}

.btn-container {
  margin: 30px 0;
}

button {
  background: #007bff;
  color: white;
  padding: 15px 40px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-size: 18px;
  font-weight: bold;
  transition: background 0.3s;
}

button:hover {
  background: #0056b3;
}

.selecionado-display {
  margin-top: 20px;
  padding: 15px;
  background: #333;
  border-radius: 5px;
  min-height: 25px;
}

</style>
</head>

<body>

<div class="container">
  <h1>🎬 Cinema VIP - Escolha seu Assento</h1>

  <!-- TELA NA FRENTE -->
  <div class="tela">📺 TELA</div>

  <div class="cinema-layout">
    <!-- COXÃO (frente) -->
    <div class="area">
      <h3>Coxão - Frente (2 lugares)</h3>
      <div class="assentos-grupo">
        <div id="C1" class="assento livre" onclick="selecionar('C1')">C1</div>
        <div id="C2" class="assento livre" onclick="selecionar('C2')">C2</div>
      </div>
    </div>

    <!-- SOFÁ -->
    <div class="area">
      <h3>Sofá - Meio (3 lugares)</h3>
      <div class="assentos-grupo">
        <div id="S1" class="assento livre" onclick="selecionar('S1')">S1</div>
        <div id="S2" class="assento livre" onclick="selecionar('S2')">S2</div>
        <div id="S3" class="assento livre" onclick="selecionar('S3')">S3</div>
      </div>
    </div>

    <!-- CADEIRA -->
    <div class="area">
      <h3>Cadeira - Fundo (1 lugar)</h3>
      <div class="assentos-grupo">
        <div id="A1" class="assento livre" onclick="selecionar('A1')">A1</div>
      </div>
    </div>
  </div>

  <!-- LEGENDA -->
  <div class="legenda">
    <div class="legenda-item">
      <div class="legenda-box" style="background: gray;"></div>
      <span>Disponível</span>
    </div>
    <div class="legenda-item">
      <div class="legenda-box" style="background: green;"></div>
      <span>Selecionado</span>
    </div>
    <div class="legenda-item">
      <div class="legenda-box" style="background: red;"></div>
      <span>Ocupado</span>
    </div>
  </div>

  <div class="selecionado-display" id="display">
    Nenhum assento selecionado
  </div>

  <div class="btn-container">
    <button onclick="enviar()">📲 Enviar Assento via WhatsApp</button>
  </div>
</div>

<script>

// Lugares já ocupados (simulação)
let ocupados = ["S2", "C1"]; 

let escolhido = null;

// Marca ocupados
ocupados.forEach(id => {
  let elemento = document.getElementById(id);
  if(elemento) {
    elemento.classList.add("ocupado");
    elemento.classList.remove("livre");
  }
});

function selecionar(id) {
  let lugar = document.getElementById(id);

  if(lugar.classList.contains("ocupado")){
    alert("Esse assento já está ocupado!");
    return;
  }

  // Limpar seleção anterior
  if(escolhido){
    let anterior = document.getElementById(escolhido);
    anterior.classList.remove("selecionado");
    anterior.classList.add("livre");
  }

  escolhido = id;
  lugar.classList.remove("livre");
  lugar.classList.add("selecionado");
  
  // Atualiza display
  document.getElementById("display").textContent = "Assento selecionado: " + escolhido;
}

function enviar(){
  if(!escolhido){
    alert("Escolha um assento!");
    return;
  }

  let mensagem = "🎬 Assento escolhido: " + escolhido + "\n\nCinema VIP";

  let numero = "5583981735110";

  let url = "https://wa.me/" + numero + "?text=" + encodeURIComponent(mensagem);

  window.open(url, "_blank");
}

</script>

</body>
</html>
